services:
  - type: web
    name: al-hayaa-backend
    env: node
    buildCommand: npm install
    startCommand: node server-supabase.cjs
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: PORT
        value: 3001
